name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit tests with coverage
        run: vendor/bin/phpunit --colors=never --coverage-clover=coverage.clover --coverage-xml=coverage.xml

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src --level=8 --no-progress

      - name: Check PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix -v --diff --dry-run

      - name: Run Rector
        run: vendor/bin/rector process src --dry-run

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan (max level)
        run: vendor/bin/phpstan analyse src --level=9 --no-progress

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

      - name: Run Rector
        run: vendor/bin/rector process src --dry-run --verbose

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit with coverage (HTML + XML + Clover)
        run: |
          vendor/bin/phpunit \
            --coverage-clover=coverage.clover \
            --coverage-xml=coverage.xml \
            --coverage-html=coverage-html

      - name: Display coverage percentage
        run: |
          COVERAGE=$(grep -oP '\d+(\.\d+)?%' coverage.xml | head -1 | tr -d '%')
          echo "Code Coverage: ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
        id: coverage

      - name: Check coverage threshold
        run: |
          MIN_COVERAGE=70
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below minimum threshold of $MIN_COVERAGE%"
            exit 1
          fi
          echo "::notice::Coverage $COVERAGE% is above minimum threshold of $MIN_COVERAGE%"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 30

      - name: Prepare GitHub Pages deployment
        run: |
          mkdir -p pages
          cp -r coverage-html/* pages/
          echo "Coverage Report" > pages/index.html
          echo "<meta http-equiv=\"refresh\" content=\"0; url=index.html\">" >> pages/index.html

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
