name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit tests with coverage
        run: vendor/bin/phpunit --colors=never --coverage-clover=coverage.clover --coverage-xml=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          flags: unittests
          name: PHP-${{ matrix.php }}

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src --level=5 --no-progress

      - name: Check PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix -v --diff --dry-run

      - name: Run Rector
        run: vendor/bin/rector process src --dry-run

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan (max level)
        run: vendor/bin/phpstan analyse src --level=8 --no-progress

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

      - name: Run Rector
        run: vendor/bin/rector process src --dry-run --verbose

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.clover --coverage-xml=coverage.xml

      - name: Check coverage threshold
        run: |
          # Check if coverage is above minimum threshold (e.g., 70%)
          MIN_COVERAGE=70
          COVERAGE=$(grep -oP '\d+(\.\d+)?%' coverage.xml | head -1 | tr -d '%')
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "Coverage $COVERAGE% is below minimum threshold of $MIN_COVERAGE%"
            exit 1
          fi
          echo "Coverage $COVERAGE% is above minimum threshold of $MIN_COVERAGE%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          flags: unittests
          name: coverage-check
          fail_ci_if_error: true

      - name: Compare coverage with main branch
        if: github.event_name == 'pull_request'
        run: |
          # Download main branch coverage for comparison
          # This requires CODECOV_TOKEN to be set in repository secrets
          echo "Codecov will handle the comparison automatically"
          echo "If coverage drops below main branch, Codecov will fail the check"
